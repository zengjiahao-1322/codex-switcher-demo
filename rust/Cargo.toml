[package]
name = "switcher-prototype"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "=1.43.0", features = ["net", "rt", "macros", "time"] }
hyper = { version = "=1.6.0", features = ["server", "client", "http1"] }
hyper-util = { version = "=0.1.10", features = ["tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }

[build-dependencies]
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
