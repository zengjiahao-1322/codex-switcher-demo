[package]
name = "codex-switcher"
version = "0.0.1"
edition = "2024"
publish = false
default-run = "codex-switcher"

[[bin]]
name = "upgrade-bridge"
path = "src/bin/upgrade-bridge.rs"

[dependencies]
tokio = { version = "=1.43.0", features = ["net", "rt", "macros", "time", "process", "io-util", "sync", "signal"] }
hyper = { version = "=1.6.0", features = ["server", "client", "http1"] }
hyper-util = { version = "=0.1.10", features = ["tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.8", features = ["preserve_order"] }
toml_edit = "=0.22.27"
regex = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
reqwest = { version = "=0.12.12", features = ["json"] }
serde_yaml = "0.9"
notify = { version = "=6.1.1", default-features = false, features = ["crossbeam-channel", "macos_kqueue"] }
base64 = "0.22"

[build-dependencies]
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
