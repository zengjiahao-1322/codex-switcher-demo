name: Rust compile and backend parity
on:
  push:
    branches: [main]
    paths: ['rust/**', 'tests/**', '.github/workflows/rust-compile.yml']
  pull_request:
    paths: ['rust/**', 'tests/**', '.github/workflows/rust-compile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - run: npm install --ignore-scripts
      - run: npm install --global @openai/codex@0.163.0
      - name: Locate native test runtime
        shell: bash
        run: CODEX_NPM_ROOT="$(npm root -g)" node scripts/ci-setup.cjs
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup override set stable
          rustup component add rustfmt clippy
      - name: Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Rust lint
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Rust unit tests
        run: cargo test --locked --manifest-path rust/Cargo.toml --target ${{ matrix.target }}
      - name: Compile only
        run: cargo build --locked --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }}
      - name: Prepare Windows Node process helper
        if: runner.os == 'Windows'
        run: node scripts/build-windows-helper.cjs
      - name: Node black-box baseline
        run: node --test tests/blackbox-framework.test.cjs tests/blackbox-diagnostics.test.cjs tests/blackbox-platform.test.cjs tests/blackbox-editors.test.cjs tests/blackbox-config.test.cjs tests/blackbox-config-algorithm.test.cjs tests/blackbox-config-matrix.test.cjs tests/blackbox-config-backups.test.cjs tests/blackbox-config-network.test.cjs tests/blackbox-accounts.test.cjs tests/blackbox-accounts-network.test.cjs tests/blackbox-accounts-native.test.cjs tests/blackbox-local-switch.test.cjs tests/blackbox-switching.test.cjs tests/blackbox-remote.test.cjs tests/blackbox-threads-native.test.cjs
      - name: Same black boxes against Rust
        shell: bash
        env:
          SWITCHER_BACKEND: rust
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then suffix=.exe; else suffix=; fi
          export SWITCHER_RUST_EXE="$PWD/rust/target/${{ matrix.target }}/release/switcher-prototype$suffix"
          node --test tests/blackbox-framework.test.cjs tests/blackbox-diagnostics.test.cjs tests/blackbox-platform.test.cjs tests/blackbox-editors.test.cjs tests/blackbox-config.test.cjs tests/blackbox-config-algorithm.test.cjs tests/blackbox-config-matrix.test.cjs tests/blackbox-config-backups.test.cjs tests/blackbox-config-network.test.cjs tests/blackbox-accounts.test.cjs tests/blackbox-accounts-network.test.cjs tests/blackbox-accounts-native.test.cjs tests/blackbox-local-switch.test.cjs tests/blackbox-switching.test.cjs tests/blackbox-remote.test.cjs tests/blackbox-threads-native.test.cjs
