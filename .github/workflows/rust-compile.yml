name: Rust compile and backend parity
on:
  push:
    branches: [main]
    paths:
      ['rust/**', 'tests/**', 'scripts/**', 'platform/**', '.github/workflows/rust-compile.yml']
  pull_request:
    paths:
      ['rust/**', 'tests/**', 'scripts/**', 'platform/**', '.github/workflows/rust-compile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - run: npm install --ignore-scripts
      - run: npm install --global @openai/codex@0.163.0
      - name: Locate native test runtime
        shell: bash
        run: CODEX_NPM_ROOT="$(npm root -g)" node scripts/ci-setup.cjs
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup override set stable
          rustup component add rustfmt clippy
      - name: Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Rust lint
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Rust unit tests
        run: cargo test --locked --manifest-path rust/Cargo.toml --target ${{ matrix.target }}
      - name: Compile only
        run: cargo build --locked --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }}
      - name: Prepare Windows Node process helper
        if: runner.os == 'Windows'
        run: node scripts/build-windows-helper.cjs
      - name: Node black-box baseline
        run: node --test --test-concurrency=1 tests/blackbox-framework.test.cjs tests/blackbox-migration.test.cjs tests/blackbox-diagnostics.test.cjs tests/blackbox-platform.test.cjs tests/blackbox-editors.test.cjs tests/blackbox-config.test.cjs tests/blackbox-config-algorithm.test.cjs tests/blackbox-config-matrix.test.cjs tests/blackbox-config-backups.test.cjs tests/blackbox-config-network.test.cjs tests/blackbox-accounts.test.cjs tests/blackbox-accounts-network.test.cjs tests/blackbox-accounts-native.test.cjs tests/blackbox-local-switch.test.cjs tests/blackbox-switching.test.cjs tests/blackbox-remote.test.cjs tests/blackbox-threads-native.test.cjs tests/blackbox-window-algorithm.test.cjs tests/blackbox-extension-install.test.cjs tests/blackbox-remote-expiry.test.cjs tests/blackbox-adapter.test.cjs tests/blackbox-process-fault.test.cjs tests/blackbox-batch6.test.cjs
      - name: Same black boxes against Rust
        shell: bash
        env:
          SWITCHER_BACKEND: rust
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then suffix=.exe; else suffix=; fi
          export SWITCHER_RUST_EXE="$PWD/rust/target/${{ matrix.target }}/release/codex-switcher$suffix"
          node --test --test-concurrency=1 tests/blackbox-framework.test.cjs tests/blackbox-migration.test.cjs tests/blackbox-diagnostics.test.cjs tests/blackbox-platform.test.cjs tests/blackbox-editors.test.cjs tests/blackbox-config.test.cjs tests/blackbox-config-algorithm.test.cjs tests/blackbox-config-matrix.test.cjs tests/blackbox-config-backups.test.cjs tests/blackbox-config-network.test.cjs tests/blackbox-accounts.test.cjs tests/blackbox-accounts-network.test.cjs tests/blackbox-accounts-native.test.cjs tests/blackbox-local-switch.test.cjs tests/blackbox-switching.test.cjs tests/blackbox-remote.test.cjs tests/blackbox-threads-native.test.cjs tests/blackbox-window-algorithm.test.cjs tests/blackbox-extension-install.test.cjs tests/blackbox-remote-expiry.test.cjs tests/blackbox-adapter.test.cjs tests/blackbox-process-fault.test.cjs tests/blackbox-batch6.test.cjs
      - name: Verify native browser behavior
        shell: bash
        env:
          SWITCHER_BACKEND: rust
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then suffix=.exe; else suffix=; fi
          export SWITCHER_RUST_EXE="$PWD/rust/target/${{ matrix.target }}/release/codex-switcher$suffix"
          npm install --prefix .build-cache/browser-check --no-package-lock --ignore-scripts playwright@1.56.1
          node .build-cache/browser-check/node_modules/playwright/cli.js install chromium
          node scripts/verify-web-entry.cjs
          node scripts/verify-quota-ui.cjs
      - name: Package native release
        shell: bash
        env:
          SWITCHER_RUST_BIN_DIR: rust/target/${{ matrix.target }}/release
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then platform=win32; arch=x64; elif [[ "${{ matrix.target }}" == "aarch64-apple-darwin" ]]; then platform=darwin; arch=arm64; else platform=darwin; arch=x64; fi
          node scripts/build-release.cjs "$platform" --arch="$arch" --backend=rust
          node scripts/smoke-package.cjs "$platform"
          SWITCHER_RELEASE_BACKEND=rust node scripts/create-release-json.cjs v0.1.5 dist dist/release.json
      - name: Verify native macOS installation and launcher
        if: runner.os == 'macOS'
        run: |
          node scripts/verify-mac-installer.cjs
          node scripts/verify-mac-launcher.cjs
      - name: Compare native and Node package performance
        shell: pwsh
        run: |
          $platform = if ($IsWindows) {'win32'} else {'darwin'}
          $arch = if ('${{ matrix.target }}' -eq 'aarch64-apple-darwin') {'arm64'} else {'x64'}
          $suffix = if ($IsWindows) {'.exe'} else {''}
          $nodeOutput = Join-Path $env:RUNNER_TEMP 'node-reference-package'
          node scripts/build-release.cjs $platform $nodeOutput "--arch=$arch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $asset = if ($IsWindows) {'codex-switcher-windows-x64.zip'} else {"codex-switcher-macos-$arch.zip"}
          ./rust/measure.ps1 -Rounds 10 -IdleSeconds 60 -NodeExecutable (Get-Command node).Source -NativeExecutable "$PWD/rust/target/${{ matrix.target }}/release/codex-switcher$suffix" -NodeArchive (Join-Path $nodeOutput $asset) -NativeArchive (Join-Path "$PWD/dist" $asset) > dist/performance.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/*
