name: macOS validation only

# 仅临时验证分支触发，不更新主分支，不创建 Release。
on:
  push:
    branches: ['verify/macos-*']

permissions:
  contents: read

jobs:
  validate:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - run: npm install --ignore-scripts
      - run: npm install --global @openai/codex@0.163.0
      - name: Prepare official runtime and native process reader
        shell: bash
        run: CODEX_NPM_ROOT="$(npm root -g)" node scripts/ci-setup.cjs
      - name: Run shared regression and native quota scenarios
        run: node test-all.cjs
      - name: Verify the actual macOS official extension
        run: node scripts/macos-validation.cjs
      - name: Prepare an isolated browser for Windows bug parity checks
        run: |
          npm install --prefix .build-cache/browser-check --no-package-lock --ignore-scripts playwright@1.56.1
          node .build-cache/browser-check/node_modules/playwright/cli.js install chromium
      - name: Verify independent quota refresh in the actual frontend
        run: node scripts/verify-quota-ui.cjs
      - name: Build a local universal test package
        run: node scripts/build-release.cjs darwin
      - name: Verify the extracted test package
        run: node scripts/smoke-package.cjs darwin
      - name: Verify the packaged app entry in a minimal environment
        run: node scripts/verify-mac-launcher.cjs
      - name: Verify installation with the macOS system Bash
        run: node scripts/verify-mac-installer.cjs
      # 仅保存通过检查的通用测试包，不触发正式发布，也不替换已有下载。
      - name: Save the universal macOS test download
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: codex-switcher-macos-test-universal
          path: |
            dist/codex-switcher-macos-universal.zip
            dist/codex-switcher-macos-universal.zip.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-validation-${{ matrix.arch }}
          path: |
            verification/test-results.tap
            verification/macos-validation.json
            verification/macos-launcher.json
            verification/macos-installer.json
            verification/macos-package.json
            verification/quota-ui.json
            verification/quota-ui-waiting.png
          retention-days: 7
