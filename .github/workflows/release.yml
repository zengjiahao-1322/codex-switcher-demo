name: Verify and package
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor-validation:
    uses: ./.github/workflows/editor-reload-validation.yml
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32
            arch: x64
          - os: macos-15
            target: darwin
            arch: arm64
          - os: macos-15-intel
            target: darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - run: npm install --ignore-scripts
      - run: npm install --global @openai/codex@0.163.0
      - name: Locate native test runtime
        shell: bash
        run: CODEX_NPM_ROOT="$(npm root -g)" node scripts/ci-setup.cjs
      - run: node scripts/test-all.cjs
      # 同一批浏览器回归同时覆盖 Windows 和两种 Mac 架构。
      - name: Prepare an isolated test browser
        run: |
          npm install --prefix .build-cache/browser-check --no-package-lock --ignore-scripts playwright@1.56.1
          node .build-cache/browser-check/node_modules/playwright/cli.js install chromium
      # 每项独占一步，避免 Windows PowerShell 用后一条命令的成功覆盖前一项失败。
      - name: Verify direct browser entry
        run: node scripts/verify-web-entry.cjs
      - name: Verify independent quota refresh
        run: node scripts/verify-quota-ui.cjs
      - name: Save regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            verification/test-results.tap
            verification/web-entry.json
            verification/quota-ui.json
          if-no-files-found: warn
      - run: node scripts/build-release.cjs ${{ matrix.target }} --arch=${{ matrix.arch }}
      - name: Verify extracted release
        run: node scripts/smoke-package.cjs ${{ matrix.target }}
      - name: Verify the macOS installer with the system Bash
        if: matrix.target == 'darwin'
        run: node scripts/verify-mac-installer.cjs
      - name: Verify the macOS app through LaunchServices
        if: matrix.target == 'darwin'
        run: node scripts/verify-mac-launcher.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, editor-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true
      - name: Create release metadata
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/create-release-json.cjs "$GITHUB_REF_NAME" artifacts release.json
      - name: Publish the platform downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 用户要求替换同一版本时，更新现有下载；只有本次全部检查通过才会执行。
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* release.json --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Codex Switcher $GITHUB_REF_NAME Demo" --notes-file docs/RELEASE.md --latest
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --title "Codex Switcher $GITHUB_REF_NAME Demo" --notes-file docs/RELEASE.md --latest
          fi
